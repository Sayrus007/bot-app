<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Trading Bot Control</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0; padding: 15px;
            font-family: 'SF Pro Display', -apple-system, sans-serif;
            background-color: #000000; 
            color: #ffffff;
            user-select: none;
        }
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }
        .card {
            background: #1c1c1e;
            border-radius: 16px;
            padding: 15px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .icon { font-size: 40px; margin-bottom: 5px; }
        .title { font-size: 14px; font-weight: 600; color: #a1a1aa; margin-bottom: 5px; }
        .value { font-size: 20px; font-weight: 700; margin-bottom: 15px; }
        .controls {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #000000;
            padding: 5px;
            border-radius: 20px;
        }
        .btn-circle {
            width: 32px; height: 32px;
            border-radius: 50%; border: none;
            background: #f5a623; 
            color: #fff; font-size: 20px; font-weight: bold;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
        }
        .btn-circle:active { transform: scale(0.9); opacity: 0.8; }
        .btn-circle.red { background: #e53935; }
        
        .status-card { grid-column: span 2; }
        .status-btn {
            width: 100%; padding: 12px; border-radius: 12px; border: none;
            font-size: 16px; font-weight: bold; color: white;
            background: #e53935; cursor: pointer;
        }
        .status-btn.active { background: #10b981; }

        .pair-btn {
            flex: 1; padding: 10px; border-radius: 10px; border: none;
            font-weight: bold; color: white; background: #333; cursor: pointer;
        }
        .pair-btn.active { background: #f5a623; }

        .main-btn {
            position: fixed; bottom: 20px; left: 20px; right: 20px;
            background: #34c759; 
            color: white; border: none; padding: 16px;
            border-radius: 14px; font-size: 18px; font-weight: 700;
            width: calc(100% - 40px); cursor: pointer;
            box-shadow: 0 4px 12px rgba(52, 199, 89, 0.3);
        }
        .main-btn:active { transform: scale(0.98); }
    </style>
</head>
<body>

    <div class="grid">
        <!-- Выбор пары -->
        <div class="card status-card">
            <div class="title">Торговая пара</div>
            <div style="display: flex; gap: 10px; width: 100%; margin-top: 5px;">
                <button class="pair-btn active" id="sym-xau" onclick="setSymbol('XAUUSDm')">Золото</button>
                <button class="pair-btn" id="sym-btc" onclick="setSymbol('BTCUSDm')">Биткоин</button>
            </div>
        </div>

        <div class="card">
            <div class="icon">🎯</div>
            <div class="title">Take Profit</div>
            <div class="value" id="tp-val">$10.0</div>
            <div class="controls">
                <button class="btn-circle red" onclick="changeValue('tp', -1)">-</button>
                <button class="btn-circle" onclick="changeValue('tp', 1)">+</button>
            </div>
        </div>

        <div class="card">
            <div class="icon">📦</div>
            <div class="title">Lot Size</div>
            <div class="value" id="lot-val">0.50</div>
            <div class="controls">
                <!-- Шаг изменен на 0.01 -->
                <button class="btn-circle red" onclick="changeValue('lot', -0.01)">-</button>
                <button class="btn-circle" onclick="changeValue('lot', 0.01)">+</button>
            </div>
        </div>

        <div class="card status-card">
            <div class="title">Состояние бота</div>
            <button class="status-btn" id="bot-status" onclick="toggleBot()">🔴 БОТ ОСТАНОВЛЕН</button>
        </div>
    </div>

    <button class="main-btn" onclick="sendSettings()">ОБНОВИТЬ НАСТРОЙКИ</button>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        let tp = 10.0;
        let lot = 0.50;
        let isRunning = false;
        let symbol = 'XAUUSDm';

        function haptic() {
            tg.HapticFeedback.impactOccurred('light');
        }

        function setSymbol(sym) {
            haptic();
            symbol = sym;
            document.getElementById('sym-xau').className = (sym === 'XAUUSDm') ? 'pair-btn active' : 'pair-btn';
            document.getElementById('sym-btc').className = (sym === 'BTCUSDm') ? 'pair-btn active' : 'pair-btn';
        }

        function changeValue(type, amount) {
            haptic();
            if (type === 'tp') {
                tp = Math.max(1.0, tp + amount); 
                document.getElementById('tp-val').innerText = '$' + tp.toFixed(1);
            } else if (type === 'lot') {
                lot = Math.max(0.01, lot + amount); 
                document.getElementById('lot-val').innerText = lot.toFixed(2);
            }
        }

        function toggleBot() {
            haptic();
            isRunning = !isRunning;
            const btn = document.getElementById('bot-status');
            if (isRunning) {
                btn.className = 'status-btn active';
                btn.innerText = '🟢 БОТ РАБОТАЕТ';
            } else {
                btn.className = 'status-btn';
                btn.innerText = '🔴 БОТ ОСТАНОВЛЕН';
            }
        }

        function sendSettings() {
            tg.HapticFeedback.notificationOccurred('success');
            const data = {
                action: isRunning ? 'start' : 'stop',
                tp: tp,
                lot: lot,
                symbol: symbol
            };
            tg.sendData(JSON.stringify(data));
            setTimeout(() => tg.close(), 200);
        }
    </script>
</body>
</html>
