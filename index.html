<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AiTradingBot Panel</title>
  
  <!-- Подключение иконок Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Подключение Telegram Web App API -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      background: #000;
      color: #fff;
      overflow-x: hidden;
    }

    /* --- Основная панель (Глассморфизм) --- */
    .panel {
      width: 260px;
      height: 100vh;
      padding: 20px 15px;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      border-right: 1px solid rgba(255, 255, 255, 0.1);
      transition: width 0.4s ease;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      flex-shrink: 0;
      z-index: 10;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 25px;
      transition: 0.4s;
    }

    .header h1 {
      font-size: 1.2rem;
      font-weight: 600;
      white-space: nowrap;
      color: #38bdf8;
    }

    .toggle-btn {
      width: 40px;
      height: 40px;
      min-width: 40px;
      border: 0;
      border-radius: 50%;
      color: #fff;
      background: transparent;
      font-size: 18px;
      cursor: pointer;
      transition: 0.3s;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .toggle-btn:hover { background: rgba(255, 255, 255, 0.12); }

    .menu {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .menu-item {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 13px 15px;
      border-radius: 12px;
      text-decoration: none;
      color: rgba(255, 255, 255, 0.8);
      font-size: 0.95rem;
      transition: 0.25s;
      white-space: nowrap;
      cursor: pointer;
    }

    .menu-item:hover, .menu-item.active {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
    }

    .menu-item i {
      font-size: 1.1rem;
      min-width: 20px;
      text-align: center;
    }

    .menu-item.start-btn { color: #4ade80; }
    .menu-item.stop-btn { color: #f87171; }

    .divider {
      height: 1px;
      margin: 10px 0;
      background: rgba(255, 255, 255, 0.1);
    }

    /* --- Стили для свернутого состояния --- */
    .panel.collapsed { width: 70px; }
    .panel.collapsed .header { justify-content: center; }
    .panel.collapsed .header h1 { display: none; }
    .panel.collapsed .menu-item { padding: 13px 0; justify-content: center; }
    .panel.collapsed .menu-item span { display: none; }

    /* --- Контентная часть (Торговый Дашборд) --- */
    .main-content {
      flex-grow: 1;
      padding: 20px;
      height: 100vh;
      overflow-y: auto;
      background: radial-gradient(circle at top right, rgba(56, 189, 248, 0.1), transparent 40%);
    }

    .status-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 25px;
      font-size: 0.9rem;
      color: #94a3b8;
    }
    
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 10px #22c55e;
    }

    .asset-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.05);
      padding: 15px;
      border-radius: 12px;
      margin-bottom: 15px;
      backdrop-filter: blur(10px);
    }

    .asset-title {
      font-weight: 500;
      font-size: 1.1rem;
      margin-bottom: 8px;
      color: #e2e8f0;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .asset-data { font-size: 0.9rem; color: #94a3b8; margin-bottom: 4px; }
    .highlight { color: #38bdf8; font-weight: 600; font-size: 1.1rem; transition: color 0.3s; }
    .text-green { color: #22c55e; font-weight: 600; transition: color 0.3s; }

    .trades-title {
      font-size: 1.2rem;
      margin: 25px 0 15px 0;
      color: #e2e8f0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 5px;
    }

    .trade-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255, 255, 255, 0.03);
      padding: 12px 15px;
      border-radius: 10px;
      border-left: 3px solid #38bdf8;
      margin-bottom: 10px;
    }

    .trade-info, .trade-details { display: flex; flex-direction: column; gap: 5px; }
    .trade-details { text-align: right; }
    .symbol { font-weight: 600; font-size: 0.95rem; }
    .price { font-weight: 600; color: #f8fafc; font-size: 0.95rem; }
    .time { font-size: 0.8rem; color: #94a3b8; }
    
    .type {
      font-size: 0.75rem;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 600;
      display: inline-block;
      width: fit-content;
    }
    .buy { background: rgba(34, 197, 94, 0.2); color: #4ade80; }
    .sell { background: rgba(239, 68, 68, 0.2); color: #f87171; }

    /* Для мобилок по умолчанию скрываем сайдбар в мини-режим */
    @media (max-width: 600px) {
      .panel { width: 70px; }
      .panel .header h1 { display: none; }
      .panel .menu-item span { display: none; }
      .panel .header { justify-content: center; }
      .panel.open-mobile { width: 260px; position: absolute; }
      .panel.open-mobile .header h1, .panel.open-mobile .menu-item span { display: block; }
      .panel.open-mobile .header { justify-content: space-between; }
    }
  </style>
</head>
<body>

  <!-- БОКОВОЕ МЕНЮ (Sidebar) -->
  <div class="panel collapsed" id="panel">
    <div class="header">
      <h1>Bot Panel</h1>
      <button class="toggle-btn" id="toggleBtn">
        <i class="fa-solid fa-bars" id="toggleIcon"></i>
      </button>
    </div>

    <div class="menu">
      <a class="menu-item active">
        <i class="fa-solid fa-chart-line"></i>
        <span>Dashboard</span>
      </a>
      
      <!-- Обратите внимание на вызов sendCommand -->
      <a class="menu-item start-btn" onclick="sendCommand('start')">
        <i class="fa-solid fa-play"></i>
        <span>Запустить бота</span>
      </a>
      
      <!-- Обратите внимание на вызов sendCommand -->
      <a class="menu-item stop-btn" onclick="sendCommand('stop')">
        <i class="fa-solid fa-stop"></i>
        <span>Остановить бота</span>
      </a>
      
      <div class="divider"></div>
      
      <a class="menu-item" onclick="tg.showAlert('Для смены счета используйте команду /login в чате с ботом')">
        <i class="fa-solid fa-users"></i>
        <span>Смена счета</span>
      </a>
      <a class="menu-item" onclick="tg.close()">
        <i class="fa-solid fa-xmark"></i>
        <span>Закрыть панель</span>
      </a>
    </div>
  </div>

  <!-- ОСНОВНОЙ ДАШБОРД -->
  <div class="main-content">
    <div class="status-bar">
      <span class="dot" id="connection-dot"></span> <span id="connection-text">Подключение...</span>
    </div>

    <!-- Карточка: Золото -->
    <div class="asset-card">
      <div class="asset-title"><i class="fa-solid fa-coins" style="color: #fbbf24;"></i> XAUUSD (Gold)</div>
      <!-- Добавлен ID xau-price -->
      <div class="asset-data">Текущий тик: <span class="highlight" id="xau-price">0.00</span></div>
      <!-- Добавлен класс status-indicator-text -->
      <div class="asset-data">Статус: <span class="text-green status-indicator-text">Ожидание...</span></div>
    </div>

    <!-- Карточка: Биткоин -->
    <div class="asset-card">
      <div class="asset-title"><i class="fa-brands fa-bitcoin" style="color: #f7931a;"></i> BTCUSD (Bitcoin)</div>
      <!-- Добавлен ID btc-price -->
      <div class="asset-data">Текущий тик: <span class="highlight" id="btc-price">0.00</span></div>
      <!-- Добавлен класс status-indicator-text -->
      <div class="asset-data">Статус: <span class="text-green status-indicator-text">Ожидание...</span></div>
    </div>

    <!-- Таблица сделок (Будет заполняться из Python, пока заглушка) -->
    <h3 class="trades-title">Последние сделки</h3>
    <div id="trades-container">
        <!-- Сделки появятся здесь -->
        <div style="color: #94a3b8; font-size: 0.9rem;">Ожидание данных...</div>
    </div>
  </div>

  <!-- СКРИПТЫ -->
  <script>
    // 1. Настройка Telegram Web App
    let tg = window.Telegram.WebApp;
    tg.expand();
    tg.setHeaderColor('#000000');
    tg.setBackgroundColor('#000000');

    // 2. Логика Sidebar'а (Сворачивание/Разворачивание)
    const panel = document.getElementById('panel');
    const toggleBtn = document.getElementById('toggleBtn');
    const toggleIcon = document.getElementById('toggleIcon');

    toggleBtn.addEventListener('click', () => {
      if (window.innerWidth <= 600) {
        panel.classList.toggle('open-mobile');
        panel.classList.remove('collapsed');
      } else {
        panel.classList.toggle('collapsed');
      }
      
      if (panel.classList.contains('collapsed') && window.innerWidth > 600) {
        toggleIcon.className = 'fa-solid fa-bars';
      } else if (!panel.classList.contains('open-mobile') && window.innerWidth <= 600) {
        toggleIcon.className = 'fa-solid fa-bars';
      } else {
        toggleIcon.className = 'fa-solid fa-xmark';
      }
    });

    if (window.innerWidth <= 600) {
      toggleIcon.className = 'fa-solid fa-bars';
    }

    // ==========================================
    // 3. WEBSOCKETS (СВЯЗЬ С PYTHON БОТОМ)
    // ==========================================
    
    // ВНИМАНИЕ: Если тестируете с телефона, замените localhost на IP вашего компьютера (например: 192.168.1.5)
    // Либо используйте адрес от ngrok, если пробрасываете туннель.
    const wsUrl = "ws://localhost:8000/ws";
    
    let ws;

    function connectWebSocket() {
        ws = new WebSocket(wsUrl);

        ws.onopen = function() {
            document.getElementById('connection-text').innerText = "Система онлайн (Подключено)";
            document.getElementById('connection-dot').style.background = "#22c55e";
            document.getElementById('connection-dot').style.boxShadow = "0 0 10px #22c55e";
        };

        ws.onmessage = function(event) {
            const data = JSON.parse(event.data);
            
            // Обновляем цены (добавляем небольшую анимацию цвета при обновлении)
            const xauEl = document.getElementById('xau-price');
            const btcEl = document.getElementById('btc-price');
            
            if(xauEl.innerText !== data.xau_price.toFixed(2)) {
                xauEl.innerText = data.xau_price.toFixed(2);
                xauEl.style.color = "#ffffff";
                setTimeout(() => xauEl.style.color = "#38bdf8", 200);
            }
            
            if(btcEl.innerText !== data.btc_price.toFixed(2)) {
                btcEl.innerText = data.btc_price.toFixed(2);
                btcEl.style.color = "#ffffff";
                setTimeout(() => btcEl.style.color = "#38bdf8", 200);
            }
            
            // Обновляем статус работы бота
            const statusElements = document.querySelectorAll('.status-indicator-text');
            statusElements.forEach(el => {
                const isActive = data.status === "ВКЛЮЧЕН";
                el.innerText = isActive ? "В работе" : "Остановлен";
                el.style.color = isActive ? "#22c55e" : "#f87171";
            });

            // Обновляем список сделок
            const tradesContainer = document.getElementById('trades-container');
            if (data.trades && data.trades.length > 0) {
                tradesContainer.innerHTML = '';
                data.trades.forEach(trade => {
                    const typeClass = trade.type === "BUY" ? "buy" : "sell";
                    tradesContainer.innerHTML += `
                        <div class="trade-item">
                            <div class="trade-info">
                                <span class="symbol">${trade.symbol}</span>
                                <span class="type ${typeClass}">${trade.type}</span>
                            </div>
                            <div class="trade-details">
                                <span class="price">${trade.price}</span>
                                <span class="time">${trade.time}</span>
                            </div>
                        </div>
                    `;
                });
            } else {
                tradesContainer.innerHTML = '<div style="color: #94a3b8; font-size: 0.9rem;">Нет открытых позиций</div>';
            }
        };

        ws.onclose = function() {
            document.getElementById('connection-text').innerText = "Связь потеряна. Переподключение...";
            document.getElementById('connection-dot').style.background = "#f87171";
            document.getElementById('connection-dot').style.boxShadow = "0 0 10px #f87171";
            
            // Пытаемся переподключиться через 3 секунды
            setTimeout(connectWebSocket, 3000);
        };
    }

    // Запускаем подключение при старте
    connectWebSocket();

    // Функция отправки команд (Старт / Стоп) в Python-бот
    function sendCommand(actionName) {
        if (ws && ws.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify({ action: actionName }));
            if (actionName === 'start') {
                tg.showAlert('Команда отправлена: Запуск бота 🟢');
            } else if (actionName === 'stop') {
                tg.showAlert('Команда отправлена: Остановка бота 🔴');
            }
        } else {
            tg.showAlert('Ошибка: Нет связи с Python-сервером');
        }
    }
  </script>
</body>
</html>
