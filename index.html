<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Trading Bot Control</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; padding: 15px; font-family: 'SF Pro Display', sans-serif; background: #000000; color: #ffffff; user-select: none; -webkit-user-select: none; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        .card { background: #1c1c1e; border-radius: 16px; padding: 15px; text-align: center; display: flex; flex-direction: column; align-items: center; }
        .icon { font-size: 40px; margin-bottom: 5px; }
        .title { font-size: 14px; font-weight: 600; color: #a1a1aa; margin-bottom: 5px; }
        .input-wrapper { display: flex; align-items: center; justify-content: center; margin-bottom: 15px; background: #2c2c2e; padding: 4px 12px; border-radius: 10px; }
        .prefix { font-size: 20px; font-weight: 700; margin-right: 2px; }
        input[type="number"] { background: transparent; border: none; color: #ffffff; font-size: 20px; font-weight: 700; text-align: center; width: 70px; outline: none; }
        input[type="number"]::-webkit-inner-spin-button, input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        .controls { display: flex; align-items: center; gap: 10px; background: #000000; padding: 5px; border-radius: 20px; }
        .btn-circle { width: 32px; height: 32px; border-radius: 50%; border: none; background: #f5a623; color: #fff; font-size: 20px; font-weight: bold; cursor: pointer; }
        .btn-circle:active { transform: scale(0.9); opacity: 0.8; }
        .btn-circle.red { background: #e53935; }
        .status-card { grid-column: span 2; }
        .status-btn { width: 100%; padding: 12px; border-radius: 12px; border: none; font-size: 16px; font-weight: bold; color: white; background: #e53935; cursor: pointer; }
        .status-btn.active { background: #10b981; }
        .pair-btn { flex: 1; padding: 10px; border-radius: 10px; border: none; font-weight: bold; color: white; background: #333; cursor: pointer; }
        .pair-btn.active { background: #f5a623; }
        .main-btn { position: fixed; bottom: 20px; left: 20px; right: 20px; background: #34c759; color: white; border: none; padding: 16px; border-radius: 14px; font-size: 18px; font-weight: 700; width: calc(100% - 40px); cursor: pointer; box-shadow: 0 4px 12px rgba(52, 199, 89, 0.3); }
        .main-btn:active { transform: scale(0.98); }
    </style>
</head>
<body>
    <div class="grid">
        <div class="card status-card">
            <div class="title">Торговая пара</div>
            <div style="display: flex; gap: 10px; width: 100%; margin-top: 5px;">
                <button class="pair-btn active" id="sym-xau" onclick="setSymbol('XAUUSDm')">Золото</button>
                <button class="pair-btn" id="sym-btc" onclick="setSymbol('BTCUSDm')">Биткоин</button>
            </div>
        </div>
        <div class="card">
            <div class="icon">🎯</div>
            <div class="title">Take Profit</div>
            <div class="input-wrapper"><span class="prefix">$</span><input type="number" id="tp-input" inputmode="decimal" step="1" onchange="manualInput('tp', this.value)"></div>
            <div class="controls">
                <button class="btn-circle red" onpointerdown="startPress('tp', -1, event)" onpointerup="stopPress()" onpointerleave="stopPress()">-</button>
                <button class="btn-circle" onpointerdown="startPress('tp', 1, event)" onpointerup="stopPress()" onpointerleave="stopPress()">+</button>
            </div>
        </div>
        <div class="card">
            <div class="icon">📦</div>
            <div class="title">Lot Size</div>
            <div class="input-wrapper"><input type="number" id="lot-input" inputmode="decimal" step="0.01" onchange="manualInput('lot', this.value)"></div>
            <div class="controls">
                <button class="btn-circle red" onpointerdown="startPress('lot', -0.01, event)" onpointerup="stopPress()" onpointerleave="stopPress()">-</button>
                <button class="btn-circle" onpointerdown="startPress('lot', 0.01, event)" onpointerup="stopPress()" onpointerleave="stopPress()">+</button>
            </div>
        </div>
        <div class="card status-card">
            <div class="title">Состояние бота</div>
            <button class="status-btn" id="bot-status" onclick="toggleBot()">🔴 БОТ ОСТАНОВЛЕН</button>
        </div>
    </div>
    <button class="main-btn" onclick="sendSettings()">ОБНОВИТЬ НАСТРОЙКИ</button>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();
        
        // ВНИМАНИЕ: Здесь мы получаем ссылку на сервер из URL!
        const urlParams = new URLSearchParams(window.location.search);
        let serverUrl = urlParams.get('server');
        if (serverUrl && serverUrl.endsWith('/')) {
            serverUrl = serverUrl.slice(0, -1); // убираем слеш на конце, если он есть
        }

        let tp = parseFloat(localStorage.getItem('saved_tp')) || 10.0;
        let lot = parseFloat(localStorage.getItem('saved_lot')) || 0.50;
        let symbol = localStorage.getItem('saved_symbol') || 'XAUUSDm';
        let isRunning = false;
        let pressTimeout; let pressInterval;

        window.onload = function() {
            document.getElementById('tp-input').value = tp.toFixed(1);
            document.getElementById('lot-input').value = lot.toFixed(2);
            setSymbol(symbol, false);
        }

        function haptic() { tg.HapticFeedback.impactOccurred('light'); }
        function saveMemory() { localStorage.setItem('saved_tp', tp); localStorage.setItem('saved_lot', lot); localStorage.setItem('saved_symbol', symbol); }

        function setSymbol(sym, playHaptic = true) {
            if(playHaptic) haptic();
            symbol = sym;
            document.getElementById('sym-xau').className = (sym === 'XAUUSDm') ? 'pair-btn active' : 'pair-btn';
            document.getElementById('sym-btc').className = (sym === 'BTCUSDm') ? 'pair-btn active' : 'pair-btn';
            saveMemory();
        }

        function manualInput(type, value) {
            let num = parseFloat(value.replace(',', '.'));
            if (isNaN(num)) num = (type === 'tp') ? 10.0 : 0.50;
            if (type === 'tp') { tp = Math.max(1.0, num); document.getElementById('tp-input').value = tp.toFixed(1); }
            else if (type === 'lot') { lot = Math.max(0.01, num); document.getElementById('lot-input').value = lot.toFixed(2); }
            saveMemory();
        }

        function changeValue(type, amount) {
            if (type === 'tp') { tp = Math.max(1.0, tp + amount); tp = Math.round(tp * 10) / 10; document.getElementById('tp-input').value = tp.toFixed(1); }
            else if (type === 'lot') { lot = Math.max(0.01, lot + amount); lot = Math.round(lot * 100) / 100; document.getElementById('lot-input').value = lot.toFixed(2); }
            saveMemory();
        }

        function startPress(type, amount, event) {
            event.preventDefault(); haptic(); changeValue(type, amount);
            pressTimeout = setTimeout(() => { pressInterval = setInterval(() => { changeValue(type, amount); }, 100); }, 400);
        }
        function stopPress() { clearTimeout(pressTimeout); clearInterval(pressInterval); }

        function toggleBot() {
            haptic(); isRunning = !isRunning;
            const btn = document.getElementById('bot-status');
            btn.className = isRunning ? 'status-btn active' : 'status-btn';
            btn.innerText = isRunning ? '🟢 БОТ РАБОТАЕТ' : '🔴 БОТ ОСТАНОВЛЕН';
        }

        function sendSettings() {
            tg.HapticFeedback.notificationOccurred('success');
            
            if (!serverUrl) {
                tg.showAlert("Ошибка: Сервер не подключен. Обновите ссылку в боте!");
                return;
            }
            
            const data = { action: isRunning ? 'start' : 'stop', tp: tp, lot: lot, symbol: symbol };
            
            fetch(serverUrl + "/api/settings", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(data)
            }).then(response => {
                if(response.ok) { tg.close(); }
                else { tg.showAlert("Ошибка сервера! Код: " + response.status); }
            }).catch(error => {
                tg.showAlert("Нет связи с компьютером! Проверьте запущен ли Ngrok.");
            });
        }
    </script>
</body>
</html>
