<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Trading Bot Control</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
  <!-- Подключаем скрипт Telegram Web App -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

  <!-- Боковая панель из видео -->
  <div class="panel" id="panel">
    <div class="header">
      <h1>Bot Panel</h1>
      <button class="toggle-btn" id="toggleBtn">
        <i class="fa-solid fa-xmark" id="toggleIcon"></i>
      </button>
    </div>
    <div class="menu">
      <a href="#" class="menu-item active" onclick="sendCommand('status')">
        <i class="fa-solid fa-chart-line"></i><span>Dashboard</span>
      </a>
      <a href="#" class="menu-item" onclick="sendCommand('switch_account')">
        <i class="fa-solid fa-user-tie"></i><span>Смена счета</span>
      </a>
      <div class="divider"></div>
      <a href="#" class="menu-item start-btn" onclick="sendCommand('start_bot')">
        <i class="fa-solid fa-play"></i><span>Запустить бота</span>
      </a>
      <a href="#" class="menu-item stop-btn" onclick="sendCommand('stop_bot')">
        <i class="fa-solid fa-stop"></i><span>Остановить бота</span>
      </a>
    </div>
  </div>

  <!-- Главная область (Дашборд) -->
  <div class="main-content">
    <div class="card-grid">
      <!-- Золото -->
      <div class="glass-card">
        <h3><i class="fa-solid fa-coins" style="color: gold;"></i> XAUUSD (Gold)</h3>
        <p>Текущий тик: <span id="xau-tick" class="highlight">2645.50</span></p>
        <p>Статус: <span class="status active">В работе</span></p>
      </div>
      <!-- Биткоин -->
      <div class="glass-card">
        <h3><i class="fa-brands fa-bitcoin" style="color: #f7931a;"></i> BTCUSD (Bitcoin)</h3>
        <p>Текущий тик: <span id="btc-tick" class="highlight">63400.00</span></p>
        <p>Статус: <span class="status active">В работе</span></p>
      </div>
    </div>

    <!-- Список сделок -->
    <div class="glass-card trades-card">
      <h3>Открытые сделки</h3>
      <table class="trades-table">
        <tr>
          <th>Символ</th>
          <th>Тип</th>
          <th>Цена открытия</th>
          <th>Время</th>
        </tr>
        <tr>
          <td>XAUUSD</td>
          <td style="color: #00ff88;">BUY</td>
          <td>2640.10</td>
          <td>17:35:12</td>
        </tr>
        <tr>
          <td>BTCUSD</td>
          <td style="color: #ff3366;">SELL</td>
          <td>63500.00</td>
          <td>17:40:05</td>
        </tr>
      </table>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
