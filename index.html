<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AiTradingBot Panel</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
    body { min-height: 100vh; display: flex; background: #000; color: #fff; overflow-x: hidden; -webkit-tap-highlight-color: transparent;}

    /* --- Основная панель (Глассморфизм) --- */
    .panel { width: 260px; height: 100vh; padding: 20px 15px; background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px); border-right: 1px solid rgba(255, 255, 255, 0.1); transition: width 0.4s ease, transform 0.4s ease; display: flex; flex-direction: column; overflow: hidden; flex-shrink: 0; z-index: 100; }
    .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 25px; transition: 0.4s; }
    .header h1 { font-size: 1.2rem; font-weight: 600; white-space: nowrap; color: #38bdf8; }
    .toggle-btn { width: 40px; height: 40px; min-width: 40px; border: 0; border-radius: 50%; color: #fff; background: transparent; font-size: 18px; cursor: pointer; transition: 0.3s; display: flex; justify-content: center; align-items: center; }
    .toggle-btn:hover { background: rgba(255, 255, 255, 0.12); }
    .menu { display: flex; flex-direction: column; gap: 5px; }
    .menu-item { display: flex; align-items: center; gap: 16px; padding: 13px 15px; border-radius: 12px; text-decoration: none; color: rgba(255, 255, 255, 0.8); font-size: 0.95rem; transition: 0.25s; white-space: nowrap; cursor: pointer; }
    .menu-item:hover, .menu-item.active { background: rgba(255, 255, 255, 0.1); color: #fff; }
    .menu-item i { font-size: 1.1rem; min-width: 20px; text-align: center; }
    .start-btn { color: #4ade80; } .stop-btn { color: #f87171; }
    .divider { height: 1px; margin: 10px 0; background: rgba(255, 255, 255, 0.1); }

    .panel.collapsed { width: 70px; }
    .panel.collapsed .header { justify-content: center; }
    .panel.collapsed .header h1 { display: none; }
    .panel.collapsed .menu-item { padding: 13px 0; justify-content: center; }
    .panel.collapsed .menu-item span { display: none; }

    .mobile-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 50; backdrop-filter: blur(2px); }

    /* --- Контентная часть --- */
    .main-content { flex-grow: 1; padding: 20px; height: 100vh; overflow-y: auto; background: radial-gradient(circle at top right, rgba(56, 189, 248, 0.15), transparent 50%); }
    .status-bar { display: flex; align-items: center; gap: 10px; margin-bottom: 25px; font-size: 0.9rem; color: #94a3b8; }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: #22c55e; box-shadow: 0 0 10px #22c55e; }

    /* Карточки активов */
    .asset-card { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.05); padding: 15px; border-radius: 16px; margin-bottom: 15px; backdrop-filter: blur(10px); }
    .asset-title { font-weight: 500; font-size: 1.1rem; margin-bottom: 8px; color: #e2e8f0; display: flex; justify-content: space-between; align-items: center; }
    .asset-data { font-size: 0.9rem; color: #94a3b8; margin-bottom: 4px; }
    .highlight { color: #38bdf8; font-weight: 600; font-size: 1.2rem; }
    
    /* Кнопки торговли */
    .trade-buttons { display: flex; gap: 10px; margin-top: 15px; }
    .action-btn { flex: 1; padding: 10px; border-radius: 10px; border: none; font-weight: 600; font-size: 14px; cursor: pointer; transition: transform 0.1s; display: flex; justify-content: center; align-items: center; gap: 8px; }
    .action-btn:active { transform: scale(0.95); }
    .buy-btn { background: rgba(34, 197, 94, 0.15); color: #4ade80; border: 1px solid rgba(34, 197, 94, 0.3); }
    .sell-btn { background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); }

    /* Списки сделок */
    .trades-title { font-size: 1.1rem; margin: 25px 0 15px 0; color: #e2e8f0; font-weight: 500; }
    .trade-item { display: flex; justify-content: space-between; align-items: center; background: rgba(255, 255, 255, 0.03); padding: 12px 15px; border-radius: 12px; border-left: 3px solid #38bdf8; margin-bottom: 10px; }
    .trade-info, .trade-details { display: flex; flex-direction: column; gap: 4px; }
    .symbol { font-weight: 600; font-size: 0.95rem; }
    .time { font-size: 0.8rem; color: #94a3b8; }
    .type { font-size: 0.75rem; padding: 2px 6px; border-radius: 4px; font-weight: 600; width: fit-content; }
    .buy { background: rgba(34, 197, 94, 0.2); color: #4ade80; }
    .sell { background: rgba(239, 68, 68, 0.2); color: #f87171; }
    
    /* Крестик закрытия */
    .close-btn { background: rgba(239, 68, 68, 0.15); color: #f87171; border: none; border-radius: 8px; width: 35px; height: 35px; display: flex; justify-content: center; align-items: center; cursor: pointer; transition: 0.2s; }
    .close-btn:active { transform: scale(0.9); }

    .mobile-menu-btn { display: none; position: fixed; bottom: 20px; right: 20px; width: 55px; height: 55px; border-radius: 50%; background: #38bdf8; color: #000; border: none; font-size: 22px; z-index: 90; box-shadow: 0 4px 15px rgba(56, 189, 248, 0.4); }

    @media (max-width: 600px) {
      .panel { position: fixed; top: 0; left: 0; width: 260px; transform: translateX(-100%); z-index: 101;}
      .panel.open-mobile { transform: translateX(0); }
      .mobile-menu-btn { display: block; }
      .mobile-overlay.active { display: block; }
      .toggle-btn { display: none; }
    }
  </style>
</head>
<body>

  <!-- Оверлей для мобильных -->
  <div class="mobile-overlay" id="mobileOverlay"></div>

  <!-- БОКОВОЕ МЕНЮ (Старый красивый дизайн) -->
  <div class="panel collapsed" id="panel">
    <div class="header">
      <h1>Bot Panel</h1>
      <button class="toggle-btn" id="toggleBtn"><i class="fa-solid fa-bars" id="toggleIcon"></i></button>
    </div>
    <div class="menu">
      <a class="menu-item active" onclick="closeMobileMenu()"><i class="fa-solid fa-chart-line"></i><span>Dashboard</span></a>
      <a class="menu-item start-btn" onclick="sendCommand('start')"><i class="fa-solid fa-robot"></i><span>Включить Скальпер</span></a>
      <a class="menu-item stop-btn" onclick="sendCommand('stop')"><i class="fa-solid fa-power-off"></i><span>Остановить Скальпер</span></a>
      <div class="divider"></div>
      <a class="menu-item" onclick="tg.close()"><i class="fa-solid fa-xmark"></i><span>Закрыть панель</span></a>
    </div>
  </div>

  <button class="mobile-menu-btn" id="mobileMenuBtn"><i class="fa-solid fa-bars"></i></button>

  <!-- ОСНОВНОЙ ДАШБОРД -->
  <div class="main-content">
    <div class="status-bar">
      <span class="dot" id="connection-dot"></span> <span id="connection-text">Подключение...</span>
      <span style="margin-left: auto; color: #38bdf8; font-weight: 500;" id="bot-status-text">Скальпер: Ожидание</span>
    </div>

    <!-- Карточка: Золото -->
    <div class="asset-card">
      <div class="asset-title">
          <span><i class="fa-solid fa-coins" style="color: #fbbf24;"></i> XAUUSDm</span>
          <span class="highlight" id="q-xau">0.00</span>
      </div>
      <div class="asset-data">Авто-торговля: <span class="status-indicator-text">Ожидание...</span></div>
      
      <div class="trade-buttons">
          <button class="action-btn sell-btn" onclick="sendCommand('sell', 'XAUUSDm')">SELL</button>
          <button class="action-btn buy-btn" onclick="sendCommand('buy', 'XAUUSDm')">BUY</button>
      </div>
    </div>

    <!-- Карточка: Биткоин -->
    <div class="asset-card">
      <div class="asset-title">
          <span><i class="fa-brands fa-bitcoin" style="color: #f7931a;"></i> BTCUSDm</span>
          <span class="highlight" id="q-btc">0.00</span>
      </div>
      <div class="asset-data">Авто-торговля: <span class="status-indicator-text">Ожидание...</span></div>
      
      <div class="trade-buttons">
          <button class="action-btn sell-btn" onclick="sendCommand('sell', 'BTCUSDm')">SELL</button>
          <button class="action-btn buy-btn" onclick="sendCommand('buy', 'BTCUSDm')">BUY</button>
      </div>
    </div>

    <!-- Открытые позиции -->
    <h3 class="trades-title">Открытые позиции (Живой PNL)</h3>
    <div id="open-trades-container">
        <div style="color: #94a3b8; font-size: 0.9rem;">Нет открытых позиций</div>
    </div>

    <!-- История сделок -->
    <h3 class="trades-title">История сделок</h3>
    <div id="history-container">
        <div style="color: #94a3b8; font-size: 0.9rem;">История пуста</div>
    </div>
  </div>

  <script>
    let tg = window.Telegram.WebApp;
    tg.expand();
    tg.setHeaderColor('#000000');
    tg.setBackgroundColor('#000000');

    // --- ЗВУК И ВИБРАЦИЯ ---
    let audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    
    // Разблокировка звука на iPhone при первом тапе
    document.addEventListener('touchstart', function() {
        if (audioCtx.state === 'suspended') { audioCtx.resume(); }
    }, {once:true});

    function playClickFeedback() {
        try { tg.HapticFeedback.impactOccurred('light'); } catch(e){}
        try {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.type = 'sine';
            osc.frequency.setValueAtTime(600, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 0.05);
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.05);
        } catch(e) {}
    }

    // Логика Sidebar'а
    const panel = document.getElementById('panel'), toggleBtn = document.getElementById('toggleBtn'), toggleIcon = document.getElementById('toggleIcon'), mobileMenuBtn = document.getElementById('mobileMenuBtn'), mobileOverlay = document.getElementById('mobileOverlay');
    if(toggleBtn) toggleBtn.addEventListener('click', () => { playClickFeedback(); if (window.innerWidth > 600) { panel.classList.toggle('collapsed'); toggleIcon.className = panel.classList.contains('collapsed') ? 'fa-solid fa-bars' : 'fa-solid fa-xmark'; } });
    if(mobileMenuBtn) mobileMenuBtn.addEventListener('click', () => { playClickFeedback(); panel.classList.add('open-mobile'); mobileOverlay.classList.add('active'); mobileMenuBtn.style.display = 'none'; });
    function closeMobileMenu() { if (window.innerWidth <= 600) { panel.classList.remove('open-mobile'); mobileOverlay.classList.remove('active'); setTimeout(() => { mobileMenuBtn.style.display = 'block'; }, 400); } }
    if(mobileOverlay) mobileOverlay.addEventListener('click', closeMobileMenu);

    // ==========================================
    // ВСТАВЬТЕ ВАШУ ССЫЛКУ NGROK НИЖЕ:
    const wsUrl = "wss://esteemed-maturing-juice.ngrok-free.dev/ws";
    // ==========================================
    
    let ws;
    function connectWebSocket() {
        ws = new WebSocket(wsUrl);

        ws.onopen = function() {
            document.getElementById('connection-text').innerText = "Система онлайн (Подключено)";
            document.getElementById('connection-dot').style.background = "#22c55e";
            document.getElementById('connection-dot').style.boxShadow = "0 0 10px #22c55e";
        };

        ws.onmessage = function(event) {
            const data = JSON.parse(event.data);
            
            // Тики
            document.getElementById('q-xau').innerText = data.xau_price.toFixed(2);
            document.getElementById('q-btc').innerText = data.btc_price.toFixed(2);
            
            // Статус авто-бота
            const isBotActive = data.status === "ВКЛЮЧЕН";
            document.getElementById('bot-status-text').innerText = isBotActive ? "Скальпер: РАБОТАЕТ" : "Скальпер: ОСТАНОВЛЕН";
            document.getElementById('bot-status-text').style.color = isBotActive ? "#4ade80" : "#f87171";
            
            document.querySelectorAll('.status-indicator-text').forEach(el => {
                el.innerText = isBotActive ? "В работе" : "Остановлен";
                el.style.color = isBotActive ? "#22c55e" : "#f87171";
            });

            // 1. ОТКРЫТЫЕ ПОЗИЦИИ
            const openTradesContainer = document.getElementById('open-trades-container');
            if (data.open_trades && data.open_trades.length > 0) {
                openTradesContainer.innerHTML = '';
                data.open_trades.forEach(t => {
                    const typeClass = t.type === "buy" ? "buy" : "sell";
                    const profitColor = t.profit >= 0 ? "#4ade80" : "#f87171";
                    const profitSign = t.profit > 0 ? "+" : "";
                    openTradesContainer.innerHTML += `
                        <div class="trade-item">
                            <div class="trade-info">
                                <span class="symbol">${t.symbol}</span>
                                <span class="type ${typeClass}">${t.type.toUpperCase()} ${t.volume}</span>
                            </div>
                            <div style="display: flex; align-items: center; gap: 15px;">
                                <div style="display: flex; flex-direction: column; text-align: right;">
                                    <span style="color: ${profitColor}; font-weight: 600; font-size: 1.15rem;">${profitSign}${t.profit.toFixed(2)}$</span>
                                    <span class="time">${t.price_open.toFixed(3)} &rarr; ${t.price_current.toFixed(3)}</span>
                                </div>
                                <button class="close-btn" onclick="sendCommand('close_trade', null, ${t.ticket})">
                                    <i class="fa-solid fa-xmark"></i>
                                </button>
                            </div>
                        </div>
                    `;
                });
            } else {
                openTradesContainer.innerHTML = '<div style="color: #94a3b8; font-size: 0.9rem;">Нет открытых позиций</div>';
            }

            // 2. ИСТОРИЯ СДЕЛОК
            const historyContainer = document.getElementById('history-container');
            if (data.history_trades && data.history_trades.length > 0) {
                historyContainer.innerHTML = '';
                data.history_trades.forEach(t => {
                    const typeClass = t.type === "buy" ? "buy" : "sell";
                    const profitColor = t.profit >= 0 ? "#4ade80" : "#f87171";
                    const profitSign = t.profit > 0 ? "+" : "";
                    historyContainer.innerHTML += `
                        <div class="trade-item" style="border-left: 3px solid #64748b; opacity: 0.85;">
                            <div class="trade-info">
                                <span class="symbol">${t.symbol}</span>
                                <span class="type ${typeClass}">${t.type.toUpperCase()} ${t.volume}</span>
                            </div>
                            <div style="display: flex; flex-direction: column; text-align: right;">
                                <span style="color: ${profitColor}; font-weight: 600; font-size: 1.05rem;">${profitSign}${t.profit.toFixed(2)}$</span>
                                <span class="time">${t.time}</span>
                            </div>
                        </div>
                    `;
                });
            } else {
                historyContainer.innerHTML = '<div style="color: #94a3b8; font-size: 0.9rem;">История пуста</div>';
            }
        };

        ws.onclose = function() {
            document.getElementById('connection-text').innerText = "Связь потеряна. Переподключение...";
            document.getElementById('connection-dot').style.background = "#f87171";
            document.getElementById('connection-dot').style.boxShadow = "0 0 10px #f87171";
            setTimeout(connectWebSocket, 3000);
        };
    }
    connectWebSocket();

    // Универсальная функция отправки команд
    function sendCommand(cmd, symbolName = null, ticketId = null) {
        playClickFeedback();
        if (ws && ws.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify({ action: cmd, symbol: symbolName, ticket: ticketId }));
            
            // Если закрываем боковое меню (для мобильных)
            if (cmd === 'start' || cmd === 'stop') closeMobileMenu();
        }
    }
  </script>
</body>
</html>
